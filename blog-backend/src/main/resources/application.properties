# Server port — the app will run at http://localhost:8080
server.port=8080

# PostgreSQL database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/devblog
spring.datasource.username=devblog_user
spring.datasource.password=devblog123
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT configuration
# The secret key must be long and random — never commit a real one to GitHub
jwt.secret=devblog-super-secret-key-for-signing-jwt-tokens-change-this-in-production
jwt.expiration-ms=86400000

# Logging: shows SQL queries in console so you can see what's happening
logging.level.org.springframework.jdbc.core=DEBUG
